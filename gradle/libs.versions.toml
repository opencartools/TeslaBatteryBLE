[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
junit = "4.13.2"
leakcanary = "3.0-alpha-9"
wire = "7.1.0"
cryptography = "0.6.0"
ktlint = "14.2.0"
