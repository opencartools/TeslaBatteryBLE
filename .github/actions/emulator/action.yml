name: Run a script on the CI emulator
description: Boots the emulator CI uses (Pixel 6, no window; API 34 unless asked otherwise) and runs a script on it.
inputs:
  api-level:
    description: Android API level of the system image
    required: false
    default: '34'
  script:
    description: Shell script to run once the emulator has booted
    required: true
runs:
  using: composite
  steps:
    - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-boot-timeout: 420
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        disable-animations: true
        script: ${{ inputs.script }}
