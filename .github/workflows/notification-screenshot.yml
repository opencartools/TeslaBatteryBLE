# SPDX-License-Identifier: AGPL-3.0-only
name: Notification screenshot

# Manual run: boots an emulator (Android 16 by default, the first version with
# progress-style notifications), runs the simulated car from the chosen branch
# or tag and uploads the screenshot walk, which includes the tracking
# notification in the shade (06-notification.png). Needs no PR comment: open
# the `notification-screenshots` artifact of the run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (a PR branch, for example)'
        required: false
        type: string
        default: main
      api-level:
        description: 'Android API level of the emulator'
        required: false
        type: string
        default: '36'

permissions:
  contents: read

concurrency:
  group: notification-screenshot-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    name: Screenshot the notification
    timeout-minutes: 30
    # Pinned like the release smoke test: the emulator and KVM steps are not
    # validated on ubuntu-latest.
    runs-on: ubuntu-24.04
    env:
      SMOKE_APK: app/build/outputs/apk/smoke/app-smoke.apk
      SMOKE_PKG: com.dzid26.teslable.smoke
      SMOKE_ACTIVITY: com.dzid26.teslable.smoke/com.dzid26.teslable.MainActivity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the smoke APK
        run: ./gradlew :app:assembleSmoke -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture the screenshots
        uses: ./.github/actions/emulator
        with:
          api-level: ${{ inputs.api-level }}
          script: bash .github/scripts/capture-screenshots.sh "$SMOKE_APK" notification-screenshots "$SMOKE_PKG" "$SMOKE_ACTIVITY"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notification-screenshots
          path: notification-screenshots
          if-no-files-found: warn
