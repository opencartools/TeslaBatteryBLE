# SPDX-License-Identifier: AGPL-3.0-only
name: PR paparazzi comment

# Post the card- and screen-snapshot diffs rendered by "PR paparazzi" as a pull request
# comment. The render builds pull request code, so it runs without secrets
# and hands over only the `pr-paparazzi` artifact: the differing PNGs as
# after/<name>.png (plus before/<name>.png when the snapshot existed before),
# where <name> is <card>_<state>[_jelly]_<theme> or <screen>_<theme>,
# the PR number, and the short SHAs of the after and before commits. This
# workflow runs the default branch's copy of itself and of the scripts, never
# checks out or runs pull request code, and treats the artifact as untrusted
# input. The upload token comes from the `release` environment. The shots are
# hosted as user attachments, so neither the PR nor the releases carry image
# assets. The comment links three APK sources, all static: the direct asset for
# this commit (it starts working when the commit is built), the PR builds
# release (the latest build of each open PR), and this commit's checks page,
# which leads to the Android CI run and its artifact for earlier commits.
# Previous rounds' comments are minimized as outdated, so only the newest diff
# stays expanded.
on:
  workflow_run:
    workflows: ["PR paparazzi"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-paparazzi-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post the card diffs
    if: >-
      github.event.workflow_run.name == 'PR paparazzi' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    environment: release
    permissions:
      actions: read        # download the render run's artifact; find the Android CI run's APK
      contents: read       # check out the scripts; the upload helper reads the repo id
      pull-requests: write # post/update the comment
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Outside the checkout, so nothing in the artifact lands next to the
      # scripts.
      - name: Download the diff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-paparazzi
          path: ${{ runner.temp }}/pr-paparazzi
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact is untrusted: accept only a numeric PR number for the
      # pull request the render ran for, the short SHA of the rendered
      # commit, a hex before-SHA (or "none" when the parent predates
      # Paparazzi), and PNGs with card-state-theme names (plus the narrow
      # Jelly Star light render per card state) and a PNG signature.
      # Validated PNGs land in pr-shots/after and pr-shots/before.
      - name: Validate the artifact
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "::error::$*"; exit 1; }
          regular() { [ -f "$1" ] && [ ! -L "$1" ]; }
          ARTIFACT="$RUNNER_TEMP/pr-paparazzi"
          SHOTS="$RUNNER_TEMP/pr-shots"
          for meta in pr-number short-sha before-sha; do
            regular "$ARTIFACT/$meta" || fail "the artifact has no $meta file"
          done
          pr="$(head -c 32 "$ARTIFACT/pr-number")"
          short="$(head -c 64 "$ARTIFACT/short-sha")"
          before_sha="$(head -c 64 "$ARTIFACT/before-sha")"
          [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]] || fail "the PR number in the artifact is not numeric"
          [[ "$short" =~ ^[0-9a-f]{7,40}$ && "$HEAD_SHA" == "$short"* ]] \
            || fail "the short SHA in the artifact does not match the run's commit"
          [[ "$before_sha" == "none" || "$before_sha" =~ ^[0-9a-f]{7,40}$ ]] \
            || fail "the before SHA in the artifact is not a hex SHA"
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '(.head.repo.full_name // "") + ":" + .head.ref')"
          if [ -z "$HEAD_REPO" ] || [ "$pr_head" != "$HEAD_REPO:$HEAD_BRANCH" ]; then
            fail "PR #$pr is not the pull request the run was for"
          fi
          mkdir -p "$SHOTS/after" "$SHOTS/before" "$SHOTS/diff"
          count=0
          for side in after before diff; do
            for file in "$ARTIFACT"/"$side"/*.png; do
              name="$(basename "$file")"
              [[ "$name" =~ ^[a-z0-9-]+(_[a-z0-9-]+)*_(light|dark)\.png$ ]] \
                || fail "unexpected snapshot name: $name"
              regular "$file" || fail "the artifact has no $side/$name"
              if [ "$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')" != 89504e470d0a1a0a ]; then
                fail "$side/$name is not a PNG"
              fi
              cp "$file" "$SHOTS/$side/$name"
              count=$((count + 1))
            done
          done
          [ "$count" -le 600 ] || fail "too many snapshots in the artifact"
          if [ ! -f "$ARTIFACT/unchanged" ] && [ "$(find "$SHOTS/after" -name '*.png' | wc -l)" -eq 0 ]; then
            fail "the artifact has no changed snapshots and no unchanged marker"
          fi
          {
            echo "pr=$pr"
            echo "short=$short"
            echo "before=$before_sha"
          } >> "$GITHUB_OUTPUT"

      # Host each PNG as a user attachment, so no image asset lives on the PR
      # or the releases, and build the comment body. Light by default: each
      # changed state shows its light image (before/after pair, or after-only
      # when new); the dark image follows in a <details> block only when the
      # dark render differs too, or on its own when only dark differs. The
      # narrow Jelly Star render (light only) follows the same pattern, one
      # <details> block deeper in spirit: collapsed unless it is the only
      # thing that changed.
      - name: Upload the shots and build the comment
        id: shots
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
          SHORT_SHA: ${{ steps.meta.outputs.short }}
          BEFORE_SHA: ${{ steps.meta.outputs.before }}
          SHOTS_DIR: ${{ runner.temp }}/pr-shots
        run: |
          set -euo pipefail
          shopt -s nullglob
          card_label() {
            case "$1" in
              vehicle-card_*) printf 'Cars-list card' ;;
              hero-card_*) printf 'Car-view card' ;;
              history-card_*) printf 'History card' ;;
              drive-card_*) printf 'Drive card' ;;
              trip-card_*) printf 'Trip card' ;;
              *) printf '%s' "${1%%_*}" ;;
            esac
          }
          # Cards group by state ("Cars-list card · fresh"); screens render
          # one representative state, so the screen name is the whole title.
          shot_title() {
            case "$1" in
              screen-cars-list*) printf 'Cars-list screen' ;;
              screen-car-detail*) printf 'Car-view screen' ;;
              screen-settings*) printf 'Settings screen' ;;
              *) printf '%s · %s' "$(card_label "$1")" "${1##*_}" ;;
            esac
          }
          # One theme image: upload it and print its figure (pair when the
          # before render exists, after-only when the snapshot is new).
          post_theme() {
            local stem="$1" theme="$2"
            local name="${stem}_${theme}.png"
            local url before_url diff_url diff_img
            url="$(bash .github/scripts/upload-screenshot.sh "$SHOTS_DIR/after/$name" "$name-$SHORT_SHA.png")"
            if [ -f "$SHOTS_DIR/before/$name" ]; then
              before_url="$(bash .github/scripts/upload-screenshot.sh "$SHOTS_DIR/before/$name" "before-$name-$BEFORE_SHA.png")"
              diff_img=""
              if [ -f "$SHOTS_DIR/diff/$name" ]; then
                diff_url="$(bash .github/scripts/upload-screenshot.sh "$SHOTS_DIR/diff/$name" "diff-$name-$SHORT_SHA.png")"
                diff_img="$(printf ' <img src="%s" alt="%s %s diff" width="32%%">' "$diff_url" "$stem" "$theme")"
              fi
              printf '<p><img src="%s" alt="%s %s before" width="32%%"> <img src="%s" alt="%s %s after" width="32%%">%s</p>\n\n' \
                "$before_url" "$stem" "$theme" "$url" "$stem" "$theme" "$diff_img"
              printf 'Before %s · after %s · changed pixels in red.\n\n' "$BEFORE_SHA" "$SHORT_SHA"
            else
              printf '<p><img src="%s" alt="%s %s after" width="32%%"></p>\n\n' "$url" "$stem" "$theme"
            fi
          }
          MSG="$RUNNER_TEMP/message.md"
          {
            printf '<!-- pr-paparazzi -->\n## Snapshots\n\n'
            stems="$(for f in "$SHOTS_DIR"/after/*.png; do
              name="${f##*/}"
              name="${name%_jelly_light.png}"
              name="${name%_light.png}"
              printf '%s\n' "${name%_dark.png}"
            done | sort -u)"
            if [ -z "$stems" ]; then
              if [ "$BEFORE_SHA" = "none" ]; then
                printf 'No visual change in the snapshots at %s.\n' "$SHORT_SHA"
              else
                printf 'No visual change in the snapshots at %s (vs %s).\n' "$SHORT_SHA" "$BEFORE_SHA"
              fi
            else
              if [ "$BEFORE_SHA" = "none" ]; then
                printf 'Changed snapshots at %s (no before snapshots: the merge base predates Paparazzi).\n\n' "$SHORT_SHA"
              else
                printf 'Changed snapshots at %s (vs %s).\n\n' "$SHORT_SHA" "$BEFORE_SHA"
              fi
              while IFS= read -r stem; do
                [ -n "$stem" ] || continue
                if [ -f "$SHOTS_DIR/after/${stem}_light.png" ]; then
                  printf '### %s\n\n' "$(shot_title "$stem")"
                  post_theme "$stem" light
                  if [ -f "$SHOTS_DIR/after/${stem}_dark.png" ]; then
                    printf '<details><summary>Dark theme also changed</summary>\n\n'
                    post_theme "$stem" dark
                    printf '</details>\n\n'
                  fi
                  if [ -f "$SHOTS_DIR/after/${stem}_jelly_light.png" ]; then
                    printf '<details><summary>Narrow (Jelly Star) also changed</summary>\n\n'
                    post_theme "${stem}_jelly" light
                    printf '</details>\n\n'
                  fi
                elif [ -f "$SHOTS_DIR/after/${stem}_jelly_light.png" ]; then
                  printf '### %s · narrow only\n\n' "$(shot_title "$stem")"
                  post_theme "${stem}_jelly" light
                else
                  printf '### %s · dark only\n\n' "$(shot_title "$stem")"
                  post_theme "$stem" dark
                fi
              done <<< "$stems"
              printf 'Snapshots are light- and dark-theme JVM renders of the battery cards, the history card and the screens, plus a narrow Jelly Star render of each card state.\n'
            fi
          } > "$MSG"
          # GitHub rejects comments over 65,536 characters: a broad visual
          # change keeps the head of the report and says what was cut.
          if [ "$(wc -m < "$MSG")" -gt 60000 ]; then
            head -c 60000 "$MSG" > "$MSG.cut"
            # shellcheck disable=SC2016 # the backticks are literal Markdown
            printf '\n\n_The comment was cut at GitHub'"'"'s size limit; record the snapshots locally with `.github/scripts/paparazzi-diff.sh` for the rest._\n' >> "$MSG.cut"
            mv "$MSG.cut" "$MSG"
          fi
          {
            echo "message<<COMMENT_EOF"
            cat "$MSG"
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Three links, all static: the direct asset for this commit (present even
      # before it exists, because the filename is <pr><sha7>); the release,
      # which carries the latest build of every open PR; and this commit's
      # checks page, which leads to the Android CI run and its artifact (the way
      # back to an earlier commit after the release replaced its asset).
      - name: Find the debug APK
        id: apk
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/pr-builds"
          checks_url="https://github.com/$GITHUB_REPOSITORY/commit/$HEAD_SHA/checks"
          if [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR" =~ ^[1-9][0-9]{0,9}$ ]]; then
            direct="https://github.com/$GITHUB_REPOSITORY/releases/download/pr-builds/TeslaBatteryBLE-pr${PR}-${HEAD_SHA:0:7}.apk"
            line="Debug APK: [download the APK]($direct) from the [PR builds release]($release_url) (no sign-in), or get the [zip from CI]($checks_url) (sign-in needed) for an earlier commit."
          else
            line="Debug APK: [download from the PR builds release]($release_url)"
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ${{ steps.shots.outputs.message }}

            ${{ steps.apk.outputs.line }}
          comment-tag: pr-paparazzi-${{ steps.meta.outputs.short }}
          pr-number: ${{ steps.meta.outputs.pr }}
          github-token: ${{ github.token }}

      # Collapse superseded rounds: minimize previous bot comments as outdated,
      # so only the newest diff stays expanded. History is preserved, collapsed.
      - name: Minimize superseded comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.meta.outputs.pr }}
          SHORT_SHA: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          nodes="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '[.[] | select((.body // "") | contains("<!-- pr-paparazzi -->")) | select(.body | contains("pr-paparazzi-'"$SHORT_SHA"'") | not) | .node_id] | .[]' || true)"
          query="mutation Minimize(\$id: ID!) { minimizeComment(input: {subjectId: \$id, classifier: OUTDATED }) { minimizedComment { isMinimized } } }"
          while IFS= read -r node; do
            [ -n "$node" ] || continue
            gh api graphql -f query="$query" -f id="$node" --jq '.data.minimizeComment.minimizedComment.isMinimized' > /dev/null ||
              echo "::warning::could not minimize a superseded snapshots comment"
          done <<< "$nodes"
