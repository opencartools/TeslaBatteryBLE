# SPDX-License-Identifier: AGPL-3.0-only
name: Exploratory test

# Daily pass over main with the simulated car on an emulator: the scripted
# screenshot walk, a stress pass (font scale, rotation, process death) and a
# seeded monkey run. It judges from text only (uiautomator tree, logcat) and
# files one deduplicated GitHub issue per crash, ANR or broken value. A day
# without an app-relevant change on main costs a few seconds.
on:
  schedule:
    # 03:41 UTC every day
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Monkey seed (leave empty for today''s date)'
        required: false
        type: string
      events:
        description: 'Monkey events'
        required: false
        type: string
        default: '5000'

permissions:
  contents: read

concurrency:
  group: exploratory
  cancel-in-progress: false

jobs:
  gate:
    name: Main changed?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A scheduled run is skipped when nothing that can change the app was
      # committed since the last successful run (a skipped run counts as
      # successful, a failed one does not, so failures are retried). The ignore
      # list is the one android.yml uses. A manual run always goes ahead.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/exploratory.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2> /dev/null; then
            echo "No earlier successful run on a known commit; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant="$(git diff --name-only "$last" "$GITHUB_SHA" |
            grep -vE '\.md$|^docs/|^website/|^fastlane/|^LICENSE$|^\.github/workflows/(pr|website)-.*\.yml$|^tools/signal-matrix/' || true)"
          if [ -z "$relevant" ]; then
            echo "Nothing relevant changed since $last; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since $last:"
            echo "$relevant"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  explore:
    name: Explore the simulated car
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
    timeout-minutes: 40
    # Pinned like the release smoke test: the emulator and KVM steps are not
    # validated on ubuntu-latest.
    runs-on: ubuntu-24.04
    env:
      SMOKE_APK: app/build/outputs/apk/smoke/app-smoke.apk
      SMOKE_PKG: com.dzid26.teslable.smoke
      SMOKE_ACTIVITY: com.dzid26.teslable.smoke/com.dzid26.teslable.MainActivity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The release-like build (R8, resource shrinking) with the simulated car,
      # the same one the release smoke test drives.
      - name: Build the smoke APK
        run: ./gradlew :app:assembleSmoke -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Explore
        uses: ./.github/actions/emulator
        env:
          EXPLORE_SEED: ${{ inputs.seed }}
          EXPLORE_EVENTS: ${{ inputs.events }}
        with:
          script: bash .github/scripts/explore.sh "$SMOKE_APK" explore-out "$SMOKE_PKG" "$SMOKE_ACTIVITY"

      - name: Upload findings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: explore-out
          path: explore-out
          if-no-files-found: warn

  report:
    name: File issues
    needs: explore
    if: needs.explore.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: explore-out
          path: explore-out

      # One issue per title; a repeat on a later day only adds a comment.
      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          files=(explore-out/findings/*.md)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No findings."
            exit 0
          fi
          gh label create exploratory-finding --color D93F0B \
            --description "Found by the scheduled exploratory test" 2> /dev/null || true
          for f in "${files[@]}"; do
            title="$(head -n 1 "$f")"
            body="$(tail -n +3 "$f")"
            body="$body"$'\n\n'"Run: $RUN_URL (commit $GITHUB_SHA)"
            existing="$(gh issue list --label exploratory-finding --state open --limit 100 \
              --json number,title | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Seen again. $body"
            else
              gh issue create --title "$title" --label exploratory-finding --body "$body"
            fi
          done
