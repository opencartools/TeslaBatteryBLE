# SPDX-License-Identifier: AGPL-3.0-only
name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'fastlane/**'
      - 'LICENSE'
      # CI plumbing that cannot change the app: the PR/website screenshot
      # workflows (android.yml itself still runs the CI). Scripts are not
      # ignored, because smoke-test.sh drives the smoke test and a PR
      # that changes it has to run it.
      - '.github/workflows/pr-*.yml'
      - '.github/workflows/website-*.yml'
      # The signal matrix generator has its own workflow (signal-matrix.yml).
      - 'tools/signal-matrix/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'fastlane/**'
      - 'LICENSE'
      # CI plumbing that cannot change the app: the PR/website screenshot
      # workflows (android.yml itself still runs the CI). Scripts are not
      # ignored, because smoke-test.sh drives the smoke test and a PR
      # that changes it has to run it.
      - '.github/workflows/pr-*.yml'
      - '.github/workflows/website-*.yml'
      # The signal matrix generator has its own workflow (signal-matrix.yml).
      - 'tools/signal-matrix/**'
  # Run on main with `release` ticked to cut a release from the branch head: CI
  # tags it, builds, captures screenshots and publishes the draft release, so
  # nothing is public until it is complete. The tag and pre-release flag come
  # from the draft ("Next release (draft)": type the tag into its Tag field and
  # tick Pre-release there), or from the inputs below. Without `release` it is
  # a plain CI run.
  workflow_dispatch:
    inputs:
      release:
        description: 'Release now: build the APK and publish the draft release'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Version tag, e.g. v0.4.1 or v0.4.1-beta.1 (leave empty to use the tag typed in the draft)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release (only if a tag is entered here; otherwise the draft''s checkbox is used)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Main runs are never cancelled: a draft update is not worth killing halfway
  # when rapid pushes arrive. Only PR runs are superseded; queued draft updates
  # collapse in the draft job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Secrets only reach jobs that run trusted code. `build` runs for pull requests
# and pushes without secrets and signs with the default debug key. `release`
# (v* tags) takes the signing key and ATTACHMENTS_TOKEN from the `release`
# environment and builds the signed APK itself. `draft` (main) needs no secrets.
jobs:
  tests:
    name: Unit tests
    # Release runs verify in the release job instead.
    if: |
      !(startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.tag != '')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify (unit tests)
        run: bash .github/scripts/verify.sh tests

  static:
    name: Lint and static analysis
    # Release runs verify in the release job instead.
    if: |
      !(startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.tag != '')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify (lint and static analysis)
        run: bash .github/scripts/verify.sh static

  build:
    # Release runs skip this job: the release job verifies, builds and signs
    # the app itself, so the app is not built twice.
    if: |
      !(startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.tag != '')))
    permissions:
      contents: read
    outputs:
      apk-artifact-url: ${{ steps.upload-apk.outputs.artifact-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional shared key for CI debug builds, so each PR build updates the
      # previous one in place. It is a throwaway debug key, so it lives in a
      # repository variable, not a secret; without it every run signs with a
      # fresh debug key.
      - name: Set up the shared CI debug key
        if: vars.CI_DEBUG_KEYSTORE_BASE64 != ''
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ vars.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$dir"
          # Values pasted on Windows end in CRLF, and some encoders wrap lines.
          printf '%s' "$CI_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$dir/debug.keystore"

      # Tests and static analysis run as the parallel `tests` and `static`
      # jobs; this job only builds the APK, so a PR gets its install sooner.
      # The artifact gets its own application ID (.pr), launcher label and a
      # versionName like 0.4.1-beta.1+pr85@a47c909 (PR number and head sha from the
      # env below), so it installs next to the release app and says which commit it
      # is. The release job builds without them.
      - name: Build debug APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./gradlew :app:assembleDebug -PciDebugBuild=true

      # The APK name says which PR and commit it came from; the artifact name
      # stays fixed because the screenshot comment looks it up.
      - name: Name the debug APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist-apk/TeslaBatteryBLE-${PR_NUMBER:+pr$PR_NUMBER-}${HEAD_SHA:0:7}.apk"

      - name: Upload debug APK
        id: upload-apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: teslable-debug-apk
          path: dist-apk/*.apk

  smoke:
    name: Release smoke test
    # The release job requires this check to have passed for the tagged commit.
    if: |
      !(startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.tag != '')))
    permissions:
      contents: read
    # A healthy run takes about 8 minutes; a stuck wait should fail fast, not run for 30.
    timeout-minutes: 20
    # Pinned: the emulator, KVM and adb steps are not yet validated on ubuntu-latest
    # (migrating to Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    env:
      SMOKE_APK: app/build/outputs/apk/smoke/app-smoke.apk
      SMOKE_PKG: com.dzid26.teslable.smoke
      SMOKE_ACTIVITY: com.dzid26.teslable.smoke/com.dzid26.teslable.MainActivity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The release build (R8, resource shrinking, not debuggable) with the
      # simulated car, so the emulator drives the shrunk protocol and UI code.
      - name: Build the smoke APK
        run: ./gradlew :app:assembleSmoke -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and read the simulated car
        id: smoke
        continue-on-error: true
        uses: ./.github/actions/emulator
        with:
          script: bash .github/scripts/smoke-test.sh "$SMOKE_APK" smoke-out "$SMOKE_PKG" "$SMOKE_ACTIVITY"

      # Emulator flakes (GL context preemption, adb daemon) are common on CI
      # runners; give the run one fresh boot. The step below still fails the
      # job when the app never showed the car.
      - name: Retry once
        id: retry
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/emulator
        with:
          script: rm -rf smoke-out && bash .github/scripts/smoke-test.sh "$SMOKE_APK" smoke-out "$SMOKE_PKG" "$SMOKE_ACTIVITY"

      # The car screen needs the pairing handshake, an authenticated read and
      # the battery card, so it only shows when the shrunk app works.
      - name: Assert the app reached the car
        if: steps.smoke.outcome == 'failure' && steps.retry.outcome != 'success'
        run: |
          echo "::error::the shrunk app did not reach the car (see the smoke-out artifact)"
          exit 1

      # Put the cause in the job log: the focused window, the visible texts
      # and any crash from the shrunk app (R8 strips what it cannot see used).
      - name: Show why the app stopped
        if: failure()
        run: |
          shopt -s nullglob
          for f in smoke-out/focus.txt smoke-out/window-texts.txt; do echo "== $f"; cat "$f"; done
          for f in smoke-out/crash.txt; do echo "== $f"; head -n 120 "$f"; done
          for f in smoke-out/logcat.txt; do
            echo "== $f"
            grep -E 'com\.dzid26' "$f" | head -n 60 || true
          done

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-out
          path: smoke-out
          if-no-files-found: warn

  release:
    name: Tag release
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.tag != ''))
    environment: release
    permissions:
      contents: write
      actions: write # dispatch the Pages deploy after the screenshot commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Settles RELEASE_TAG and RELEASE_PRERELEASE for the rest of the job. A
      # pushed tag is the tag; a manual release takes the tag input, else the tag
      # typed into the draft's Tag field, with the pre-release flag from the
      # input or the draft's checkbox.
      - name: Resolve the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ format('{0}', inputs.prerelease) }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Manual releases run from main only"
            exit 1
          fi
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            prerelease="$INPUT_PRERELEASE"
          else
            draft="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft and .name == "Next release (draft)") | [.tag_name, .prerelease] | @tsv' | sed -n 1p)"
            if [ -z "$draft" ]; then
              echo "::error::No draft release 'Next release (draft)' to release; pass a tag"
              exit 1
            fi
            tag="${draft%%$'\t'*}"
            prerelease="${draft##*$'\t'}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not a tag like v1.2.3 or v1.2.3-beta.1; type it into the draft's Tag field or pass the tag input"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          # Created locally first, because versionName and versionCode derive
          # from it; it is pushed only when publishing.
          git tag "$tag"

      # The CI build job is skipped on release runs, so verify here.
      - name: Verify (tests, lint, static analysis)
        run: bash .github/scripts/verify.sh

      - name: Set up signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Never publish a debug-key build: fail when the release environment
          # does not provide the signing secrets.
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the release environment"
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      # The published APK is the minified, non-debuggable release variant,
      # signed with the release key (no LeakCanary, no demo code).
      - name: Build the signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Stage the release APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::$apk missing (unsigned build?)"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/TeslaBatteryBLE-${RELEASE_TAG}.apk"

      # The shrunk app must reach the simulated car before it ships. The smoke
      # test runs the emulator on every app change on main; the release only
      # confirms it passed for this commit instead of booting another one.
      - name: Require a green smoke test for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-smoke.sh

      # Release screenshots are the Paparazzi full-screen snapshots (cars list,
      # car view, trip, Settings; light and dark), the same render the PR comments
      # use, so a release needs no emulator and no retry.
      - name: Render the screenshots
        run: |
          set -euo pipefail
          ./gradlew :app:recordPaparazziDebug --console=plain
          bash .github/scripts/release-screenshots.sh app/src/test/snapshots/images screenshots

      - name: Push the release tag
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "refs/tags/$RELEASE_TAG"

      - name: Release on tag
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
        run: bash .github/scripts/publish-tag-release.sh

      # Release bot: point the committed screenshots (README + website) at the
      # build that was just released. Tags only, commits to main, and only when
      # a PNG actually changed; website/** is ignored by Android CI, so the
      # commit does not rebuild the app or update the draft release.
      - name: Refresh the committed screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B release-shots origin/main
          changed=false
          for name in 01-trip 02-drive 01-trip-dark 02-drive-dark; do
            if [ -f "screenshots/$name.png" ] && ! cmp -s "screenshots/$name.png" "website/images/$name.png"; then
              cp "screenshots/$name.png" "website/images/$name.png"
              changed=true
            fi
          done
          if [ "$changed" != true ]; then
            echo "screenshots unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/images
          git commit -m "Refresh screenshots from ${RELEASE_TAG}"
          git push origin HEAD:main
          # A push made with GITHUB_TOKEN does not trigger other workflows, so
          # pages.yml never sees this commit; dispatch it explicitly.
          gh workflow run pages.yml --ref main

  draft:
    name: Draft next release
    # The draft only advances when the build and both verify jobs pass.
    needs: [build, tests, static]
    permissions:
      contents: write
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: draft-release
      # Newer pending runs replace older pending ones; the in-flight one finishes.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_URL: ${{ needs.build.outputs.apk-artifact-url }}
        run: bash .github/scripts/update-draft-release.sh

  # The signing key never shares a job with a write-capable token: preview-build
  # holds the keystore (read-only token, no persisted credentials) and hands the
  # APK to preview, which can write releases but sees no secrets.
  preview-build:
    name: Build signed preview APK
    # Signed with the release key like a tagged release, and only after the
    # tests, static analysis and the emulator smoke test passed for this push.
    # It is a fresh assembleRelease, not the smoke-tested APK (same as the tag job).
    needs: [tests, static, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName and versionCode are derived from git describe
          persist-credentials: false

      # The build clamps the commit count so debug and PR builds never break;
      # a preview must not ship with a clamped versionCode.
      - name: Require a recent release tag
        run: |
          set -euo pipefail
          count="$(git rev-list --count "$(git describe --tags --abbrev=0 --match 'v[0-9]*')..HEAD")"
          if [ "$count" -ge 1000 ]; then
            echo "::error::$count commits since the last v* tag; cut a tag so preview versionCodes keep rising"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the release environment"
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      # Two builds of the same commit, both R8-shrunk and signed with the release
      # key: a debuggable one (so `adb run-as` can pull logs) and a plain
      # non-debuggable one like a tagged release. They share package, key and
      # versionCode, so either installs over the other without uninstalling.
      - name: Build the signed, debuggable release APK
        run: ./gradlew :app:assembleRelease -PpreviewDebuggable=true

      - name: Stage the debuggable APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::$apk missing (unsigned build?)"; exit 1; }
          mkdir -p dist
          cp "$apk" dist/TeslaBatteryBLE-preview-debuggable.apk

      - name: Build the signed, non-debuggable release APK
        run: ./gradlew :app:assembleRelease

      - name: Stage the non-debuggable APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::$apk missing (unsigned build?)"; exit 1; }
          cp "$apk" dist/TeslaBatteryBLE-preview-release.apk

      - name: Check the debuggable flags
        run: |
          set -euo pipefail
          aapt2="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$aapt2" ]; then
            echo "::warning::aapt2 not found; skipped the debuggable check"
            exit 0
          fi
          "$aapt2" dump badging dist/TeslaBatteryBLE-preview-debuggable.apk | grep -q "application-debuggable" \
            || { echo "::error::the debuggable preview APK is not debuggable"; exit 1; }
          if "$aapt2" dump badging dist/TeslaBatteryBLE-preview-release.apk | grep -q "application-debuggable"; then
            echo "::error::the release preview APK is debuggable"
            exit 1
          fi

      - name: Upload the preview APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-apk
          path: dist/TeslaBatteryBLE-preview-*.apk
          retention-days: 1

  preview:
    name: Publish rolling preview
    needs: preview-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: preview-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download the preview APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: preview-apk
          path: dist

      - name: Publish the rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-preview-release.sh

  go-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The oracle is the vehicle-command commit the protos are pinned to, not
      # upstream HEAD: moving it is a deliberate TESLA_COMMIT bump.
      - name: Check out vehicle-command at TESLA_COMMIT
        run: |
          git init -q /tmp/vehicle-command
          git -C /tmp/vehicle-command fetch -q --depth 1 \
            https://github.com/teslamotors/vehicle-command.git "$(cat protocol/src/main/proto/TESLA_COMMIT)"
          git -C /tmp/vehicle-command checkout -q FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: /tmp/vehicle-command/go.mod
          # setup-go would key its cache on a go.sum that lives outside the
          # workspace, so it is cached explicitly below.
          cache: false

      # Keyed on the pinned oracle commit: the Go modules and build cache only
      # change when TESLA_COMMIT is bumped.
      - name: Cache the Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('protocol/src/main/proto/TESLA_COMMIT') }}

      - name: Generate fixtures from the Go runtime
        run: |
          mkdir -p /tmp/vehicle-command/fixtures
          cp tools/go-fixtures/main.go /tmp/vehicle-command/fixtures/main.go
          cd /tmp/vehicle-command
          go run ./fixtures > /tmp/fixtures.txt

      # Keys, nonces and the session clock are fixed, so every line is
      # deterministic and the whole output is compared.
      - name: Compare fixtures
        run: diff tools/go-fixtures/expected.txt /tmp/fixtures.txt
