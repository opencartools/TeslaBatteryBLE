org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Reuse the task graph and configuration between runs, and let every checkout (each PR
# worktree has its own build directory) reuse task outputs for inputs it has already
# seen. The build cache lives in ~/.gradle/caches/build-cache-1.
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
